repos:
  # - repo: https://github.com/psf/black
  #   rev: 23.11.0
  #   hooks:
  #     - id: black
  # - repo: https://github.com/pycqa/isort
  #   rev: 5.13.1
  #   hooks:
  #     - id: isort
  #       args: ["--profile", "black", "--filter-files"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^docs/webui/issue25/pyami-pin-20261024/(commands|inputs)/
      - id: check-added-large-files
        exclude: |
          (?x)^docs/webui/issue25/pyami-pin-20261024/(
            startup\.json
            | commands/[^/]+/uv\.lock\.txt
            | inputs/uv\.baseline\.lock\.txt
            | commands/12-pip-install/pip-report\.json
          )$
      - id: check-ast
      - id: check-json
      - id: check-yaml
        exclude: meta.yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        exclude: ^docs/webui/issue25/pyami-pin-20261024/(commands|inputs)/
